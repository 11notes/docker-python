name: run

on:
  workflow_dispatch:
    inputs:
      job:
        description: 'which job to run'
        type: string
        required: false

jobs:
  # ╔═════════════════════════════════════════════════════╗
  # ║                                                     ║
  # ║                                                     ║
  # ║            CHECK FOR AVAILABLE UPDATES              ║
  # ║                                                     ║
  # ║                                                     ║
  # ╚═════════════════════════════════════════════════════╝
  update:
    if: ${{ github.event.inputs.job == 'update' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [15, 14, 13, 12]

    permissions:
      actions: read
      contents: write

    steps:
      - name: checkout all tags
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 'master'
          fetch-depth: 0

      - name: get latest version
        env:
          PYTHON_VERSION: ${{ matrix.version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          LATEST_VERSION=""
          for PAGE in {1..50}; do
            RESPONSE=$(curl -fsSL --retry 3 -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/python/cpython/tags?per_page=100&page=${PAGE}")

            if [ "$(jq 'length' <<< "${RESPONSE}")" -eq 0 ]; then
              break
            fi

            LATEST_VERSION=$(jq -r '.[].name' <<< "${RESPONSE}" | grep -E "^v${PYTHON_VERSION}\.[0-9]+$" | sort -V | tail -n 1 | sed 's/^v//' || true)

            if [ -n "${LATEST_VERSION}" ]; then
              break
            fi
          done

          if [ -z "${LATEST_VERSION}" ]; then
            exit 1
          fi

          echo "LATEST_VERSION=${LATEST_VERSION}" >> "${GITHUB_ENV}"

      - name: check if updated is needed
        uses: 11notes/actions/update@v1 # v1
        with:
          latest: ${{ env.LATEST_VERSION }}

      - name: call org.version
        if: env.ACTIONS_UPDATE == 'true'
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          wait-for-completion: true
          workflow: org.version.yml
          token: "${{ secrets.REPOSITORY_TOKEN }}"
          inputs: '{ "version":"${{ env.LATEST_VERSION }}" }'

      - name: call wheel
        if: env.ACTIONS_UPDATE == 'true'
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        with:
          wait-for-completion: false
          workflow: wheel.yml
          token: "${{ secrets.REPOSITORY_TOKEN }}"
          inputs: '{ "version":"${{ env.LATEST_VERSION }}" }'

      - name: update semver
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        if: env.ACTIONS_UPDATE == 'true' && matrix.version == 15
        with:
          wait-for-completion: false
          workflow: json.latest.yml
          repo: 11notes/CICD
          token: "${{ secrets.REPOSITORY_TOKEN }}"
          inputs: '{ "app":"python", "version":"${{ env.LATEST_VERSION }}" }'